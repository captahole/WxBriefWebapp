<!DOCTYPE html>
<html lang="en">

<head>
        <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y0BP2Q8MXK"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-Y0BP2Q8MXK');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WxBriefPro – Free Aviation Weather Briefing Tool</title>
    <meta name="description" content="Get instant preflight weather briefings with METARs, TAFs, DATIS, and airport status for any US airport. Free aviation weather tool for pilots.">
    <link rel="manifest" href="/static/manifest.json">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WxBriefPro">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    
    <div class="container">

        <header>
            <h1>WxBriefPro.com</h1>
            <div class="utc-time">
                <span>Current UTC:</span>
                <span id="utc-time-display" class="utc-time-value">Loading...</span>
            </div>
        </header>

        <p class="tagline">Enter airport identifiers to get your preflight weather briefing.</p>
        
        <div class="input-section">
            <div class="airport-inputs">
                <div class="input-group">
                    <label for="departure">Departure</label>
                    <input type="text" id="departure" placeholder="JFK" class="airport-input" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="arrival">Arrival</label>
                    <input type="text" id="arrival" placeholder="LAX" class="airport-input" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="alternate">Alternate (Optional)</label>
                    <input type="text" id="alternate" placeholder="SFO" class="airport-input" autocomplete="off">
                </div>
            </div>

            <div id="recent-airports-bar" class="recent-airports-bar" style="display:none;">
                <span class="recent-label"><i class="fas fa-history"></i> Recent:</span>
                <div id="recent-airports-list" class="recent-airports-list"></div>
                <button id="clear-recent" class="clear-recent-btn" title="Clear history"><i class="fas fa-times"></i></button>
            </div>

            <button id="fetch-button" class="primary-button">
                <i class="fas fa-cloud-sun"></i> Get Weather Briefing
            </button>
        </div>

        <div class="auto-refresh-section">
            <label for="refresh-interval"><i class="fas fa-sync-alt"></i> Auto-refresh:</label>
            <select id="refresh-interval" class="refresh-select">
                <option value="">Off</option>
                <option value="30">30 sec</option>
                <option value="60">1 min</option>
                <option value="300">5 min</option>
            </select>
            <button id="auto-refresh-button" class="secondary-button">
                Start Auto-Refresh
            </button>
        </div>

        <div class="loading-indicator" id="loading-indicator">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>


        <div class="data-section">
            <div class="data-card">
                <h2><i class="fas fa-cloud"></i> METAR / TAF</h2>
                <div id="weather-output" class="data-content"></div>
            </div>

            <div class="data-card">
                <h2><i class="fas fa-broadcast-tower"></i> DATIS</h2>
                <div id="datis-output" class="data-content"></div>
            </div>

            <div class="data-card">
                <h2><i class="fas fa-plane-departure"></i> Airport Status</h2>
                <div id="status-output" class="data-content"></div>
            </div>
        </div>
        <div id="ezoic-pub-ad-placeholder-103" style="display:none;"></div>

        <footer>
            <p>Data retrieved from aviationweather.gov at <span id="data-timestamp">-</span></p>
            <nav class="footer-links">
                <a href="/about">About</a> |
                <a href="/faq">FAQ</a> |
                <a href="/contact">Contact</a> |
                <a href="/privacy-policy">Privacy Policy</a>
            </nav>
        </footer>

    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/static/sw.js')
                .catch(err => console.warn('SW registration failed:', err));
        }
    </script>
</body>

</html>
